<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punktlig — sanntidsarkiv for kollektivtrafikk i Oslo og Akershus</title>
<meta name="description" content="Et arkiv som noterer hvert minutt hva Ruter-appen tror om avgangene, og en modell som gjetter bedre på nøyaktig de samme opplysningene.">
<style>
  :root {
    --fg:#4ee88a; --fg-dim:#2c8b55; --fg-faint:#1d5236;
    --bg:#040605; --panel:#070b08; --rule:#12211a;
    --ink:#c9dcd0; --dim:#6d8a77;
    --amber:#ffc857; --red:#ff6b5e; --white:#eefaf2;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","DejaVu Sans Mono",Consolas,monospace;
    --glow:0 0 8px rgba(78,232,138,.32);
    /* About 15.5px on a 1440-wide laptop screen, 19px on a 2560 desktop, and
       a straight line between them rather than a jump at one breakpoint. */
    --type:clamp(14px, 0.3125vw + 11px, 19px);
  }
  :root[data-theme="rav"]  { --fg:#ffc857; --fg-dim:#a9822f; --fg-faint:#59451a;
                             --ink:#e8d6ae; --dim:#93805a; --rule:#241d0e;
                             --glow:0 0 8px rgba(255,200,87,.32); }
  :root[data-theme="blaa"] { --fg:#63d0ff; --fg-dim:#2b7ba3; --fg-faint:#164457;
                             --ink:#c6dfec; --dim:#6a8a9b; --rule:#0e2029;
                             --glow:0 0 8px rgba(99,208,255,.32); }
  :root[data-theme="hvit"] { --fg:#eefaf2; --fg-dim:#93a49a; --fg-faint:#42504a;
                             --ink:#cfdad3; --dim:#7d8c84; --rule:#1a221d;
                             --glow:0 0 8px rgba(238,250,242,.22); }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    /* Type scales with the window instead of sitting at one fixed size. At a
       fixed 19px the terminal read correctly on a 2560px desktop and came out
       so large on a 1440px laptop screen that the intro was cut off mid
       sentence: the same page was comfortable on one machine and zoomed-in on
       the other. Everything else on the page is expressed in em of this, so
       one rule moves the whole terminal. */
    font:400 var(--type)/1.55 var(--mono);
    text-shadow:var(--glow);
    -webkit-font-smoothing:antialiased;
  }
  /* CRT dressing: scanlines and a soft vignette. Cosmetic, never eats a click. */
  body::after {
    content:""; position:fixed; inset:0; z-index:60; pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 4px),
      radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.5) 100%);
  }

  a { color:var(--fg); }

  /* ---------- frame ---------- */
  /* The console is sized in characters, because that is what it holds. On a
     wide monitor a 64% column spent a third of itself on empty black while
     the map beside it was too narrow to show a city wider than it is tall;
     cut to a percentage instead, it clipped the longest boot line at
     "6 195 holdeplasse". The floor is the width of that line plus its
     padding, so the text can never be cut, and everything past the ceiling
     goes to the map. */
  #shell { height:100%; display:grid; gap:1px; background:var(--rule);
           grid-template-columns:minmax(0,clamp(88ch,42%,100ch)) minmax(0,1fr);
           grid-template-rows:2.5em minmax(0,1fr) 11.4em;
           grid-template-areas: "bar bar" "con map" "con tail"; }

  #bar { grid-area:bar; background:var(--panel); display:flex; align-items:center;
         gap:1rem; padding:0 1rem; font-size:.84em; color:var(--dim);
         border-bottom:1px solid var(--rule); }
  #bar .lights { display:flex; gap:7px; }
  #bar .lights i { width:13px; height:13px; border-radius:50%; }
  #bar .lights i:nth-child(1) { background:#8a3b34; }
  #bar .lights i:nth-child(2) { background:#8a7134; }
  #bar .lights i:nth-child(3) { background:var(--fg-dim); }
  /* min-width:0 is what makes the ellipsis reachable: a flex item's default
     minimum is its content, so without it the title refused to shrink and
     pushed the clock off the right edge on a phone. */
  #bar .title { color:var(--ink); white-space:nowrap; overflow:hidden;
                text-overflow:ellipsis; min-width:0; }
  #bar .grow { flex:1; }
  #bar .on { color:var(--fg); white-space:nowrap; }
  #bar .on::before { content:"● "; animation:beat 2.4s ease-in-out infinite; }
  @keyframes beat { 50% { opacity:.35 } }
  #clock { font-size:.95em; color:var(--ink); }

  .pane { background:var(--panel); min-width:0; min-height:0; position:relative;
          display:flex; flex-direction:column; }
  .pane > h2 { margin:0; padding:.5rem .9rem; font:400 .74em/1.5 var(--mono);
               letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
               border-bottom:1px solid var(--rule); display:flex; gap:.7rem;
               align-items:center; }
  .pane > h2 .grow { flex:1; }
  .pane > h2 b { font-weight:400; color:var(--fg-dim); text-transform:none;
                 letter-spacing:0; }

  /* ---------- console ---------- */
  #con { grid-area:con; }
  #out { flex:1; min-height:0; overflow-y:auto; overflow-x:auto;
         padding:1rem 1.1rem 0; scrollbar-width:thin;
         scrollbar-color:var(--fg-faint) transparent; }
  #out::-webkit-scrollbar { width:10px; height:10px; }
  #out::-webkit-scrollbar-thumb { background:var(--fg-faint); }
  #out .ln { white-space:pre; }
  #out .wrap { white-space:pre-wrap; max-width:76ch; }
  /* A bullet whose continuation lines line up under its own text rather than
     under the dash. The list used to be pre-wrapped by hand, one array entry
     per visual line, so every continuation got a dash of its own and six
     bullets read as nine. */
  #out .bul { white-space:pre-wrap; max-width:76ch;
              padding-left:2ch; text-indent:-2ch; }
  #out .blk { margin:0 0 1.2rem; }
  #out .echo { color:var(--dim); margin:.45rem 0 .6rem; }
  #out .echo b { color:var(--fg); font-weight:400; }
  #out .err { color:var(--red); }
  .g { color:var(--fg); } .w { color:var(--white); } .d { color:var(--dim); }
  .a { color:var(--amber); } .r { color:var(--red); } .f { color:var(--fg-faint); }
  .hd { color:var(--dim); }
  .rule { color:var(--fg-faint); }

  #chips { display:flex; gap:.45rem; flex-wrap:wrap; padding:.6rem 1.1rem .1rem; }
  #chips button { font:400 .84em/1 var(--mono); color:var(--fg-dim); cursor:pointer;
                  background:transparent; border:1px solid var(--rule); border-radius:4px;
                  padding:.42rem .65rem; text-shadow:none; }
  #chips button:hover { color:var(--bg); background:var(--fg); border-color:var(--fg); }

  #line { display:flex; align-items:center; gap:.55rem; padding:.55rem 1.1rem .95rem; }
  #line .ps { color:var(--fg); white-space:nowrap; }
  #line .ps b { color:var(--dim); font-weight:400; }
  #cmd { flex:1; min-width:0; background:transparent; border:0; outline:0;
         font:inherit; color:var(--white); caret-color:var(--fg); text-shadow:var(--glow); }

  /* ---------- map ---------- */
  #map { grid-area:map; }
  /* min-height:0 is load-bearing. A canvas is a replaced element, so its
     automatic minimum size is its intrinsic height, and a flex item is not
     allowed to shrink below that. `fit` sets the intrinsic height from the
     box it measures, so the two fed each other: the canvas grew to 1354px
     inside a 1054px panel, pushed the legend strip out of view entirely, and
     was reported as 1068px tall in a 900px window. Zeroing the minimum lets
     the row height decide the canvas rather than the other way round. */
  #cv { flex:1; min-height:0; min-width:0; width:100%; display:block;
        cursor:grab; touch-action:none; }
  #cv.drag { cursor:grabbing; }
  /* The counts and the colour key used to float on the canvas. With no
     backdrop they sat directly on top of vehicles and route geometry, and at
     laptop width the count wrapped onto two lines straight across the middle
     of the city: unreadable as text and as map at the same time. A strip of
     its own cannot collide with anything. */
  #mapfoot { display:flex; align-items:center; gap:.9rem; padding:.42rem .9rem;
             font-size:.74em; color:var(--dim); background:var(--panel);
             border-top:1px solid var(--rule); white-space:nowrap;
             overflow:hidden; }
  #mapfoot .grow { flex:1; }
  #mapinfo { overflow:hidden; text-overflow:ellipsis; }
  #mapkey i { display:inline-block; width:9px; height:9px; border-radius:50%;
              margin:0 .2rem 0 .6rem; vertical-align:-1px; }
  #mapzoom { color:var(--fg-dim); }

  /* ---------- tail ---------- */
  #tail { grid-area:tail; }
  #feed { flex:1; min-height:0; overflow:hidden; padding:.4rem .8rem; }
  #feed div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
              font-size:.84em; line-height:1.65; animation:in .35s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(4px) } }

  /* ---------- sl ---------- */
  #sl { position:fixed; z-index:70; left:100vw; top:22vh; white-space:pre;
        color:var(--fg); font-size:.9em; line-height:1.15; pointer-events:none;
        text-shadow:var(--glow); }

  @media (max-width:960px) {
    /* One column, and the map first: on a phone it is the part worth the
       screen. The type stays on the same scale as everywhere else rather
       than being pinned back to a fixed size here. */
    body { overflow:auto; }
    #shell { height:auto; grid-template-columns:minmax(0,1fr);
             grid-template-rows:2.5em 44vh 70vh 12rem;
             grid-template-areas:"bar" "map" "con" "tail"; }
    /* The console's floor is a character count, which one column cannot
       honour on a narrow screen; there it scrolls sideways instead of
       forcing the page to. */
    #out { overflow-x:auto; }
  }
  @media (max-width:560px) {
    /* The window dressing loses to the data. Lights, hostname, freshness and
       clock add up to more than a phone is wide, and of the four only the
       freshness stamp tells the reader anything; even shrunk to nothing the
       rest pushed the clock six pixels off the edge and gave the whole page
       a sideways scroll. */
    #bar .lights, #bar .title { display:none; }
    #bar .on { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  }
</style>
</head>
<body>

<div id="shell">
  <div id="bar">
    <span class="lights"><i></i><i></i><i></i></span>
    <span class="title">punktlig@arkiv — sanntidsterminal</span>
    <span class="grow"></span>
    <span class="on" id="feedstate">&hellip;</span>
    <span id="clock">--:--:--</span>
  </div>

  <div class="pane" id="con">
    <div id="out"></div>
    <div id="chips"></div>
    <div id="line">
      <span class="ps">punktlig@arkiv<b>:</b>~<b>$</b></span>
      <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" aria-label="kommandolinje">
    </div>
  </div>

  <div class="pane" id="map">
    <h2>kart <b id="mapmode"></b><span class="grow"></span>
        <b>klikk en vogn &middot; dra &middot; rull for å zoome &middot; dobbeltklikk nullstiller</b></h2>
    <canvas id="cv"></canvas>
    <div id="mapfoot">
      <span id="mapinfo">&hellip;</span>
      <span class="grow"></span>
      <span id="mapzoom"></span>
      <span id="mapkey">forsinkelse
        <i style="background:var(--fg)"></i>&lt;1<i style="background:var(--amber)"></i>1-3
        <i style="background:var(--red)"></i>&gt;3 min</span>
    </div>
  </div>

  <div class="pane" id="tail">
    <h2>tail -f innsamling.log<span class="grow"></span><b id="tailstate">kjører</b></h2>
    <div id="feed"></div>
  </div>
</div>

<div id="sl" hidden></div>

<script>
"use strict";
const NB = n => new Intl.NumberFormat("nb-NO").format(n);
const one = n => n.toLocaleString("nb-NO", {minimumFractionDigits:1, maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const padr = (s, n) => String(s).padEnd(n, " ");
const padl = (s, n) => String(s).padStart(n, " ");

// Seconds -> "4 min 20 s" / "40 s"; delays get an explicit sign.
const dur = s => { s = Math.round(s); const m = Math.trunc(s / 60);
                   return m ? `${m} min ${Math.abs(s % 60)} s` : `${s} s`; };
const signed = s => (s >= 0 ? "+" : "-") + dur(Math.abs(s));

const out = document.getElementById("out");
const cmd = document.getElementById("cmd");
let DATA = null;

/* ------------------------------------------------------------------ output */

// Printing happens line by line rather than all at once, which is the whole
// difference between a terminal and a div. The delay is captured per line at
// queue time, and any keypress flushes the rest out of the way.
let queue = [], printing = false, SPEED = 10;

function flush() {
  while (queue.length) out.appendChild(queue.shift().el);
  out.scrollTop = out.scrollHeight;
  printing = false;
}

function pump() {
  const next = queue.shift();
  if (!next) { printing = false; return; }
  printing = true;
  out.appendChild(next.el);
  out.scrollTop = out.scrollHeight;
  setTimeout(pump, next.speed);
}

function push(el) {
  queue.push({el, speed:SPEED});
  if (!printing) pump();
}

function print(html, cls) {
  const el = document.createElement("div");
  el.className = cls || "ln";
  el.innerHTML = html;
  push(el);
}

const blank = () => print("&nbsp;");
const wrap  = t => print(t, "wrap");
const block = () => { const el = document.createElement("div");
                      el.className = "blk"; push(el); };

function heading(text) {
  print(`<span class="rule">${"─".repeat(3)}</span> <span class="w">${esc(text)}</span> ` +
        `<span class="rule">${"─".repeat(Math.max(2, 56 - text.length))}</span>`);
  blank();
}

function meterRows(rows, worst, width) {
  // The label column is measured, not assumed. It was pinned at eleven
  // characters while one of the labels is thirteen, so that row's bar started
  // two characters right of the others and its number ended two characters
  // right of theirs. Four bars meant to be read against each other, and the
  // one thing a bar chart has to get right is a common baseline.
  const pad = Math.max(...rows.map(r => String(r.k).length)) + 1;
  rows.forEach(r => {
    const n = Math.round(r.v / worst * width);
    print(`<span class="d">${padr(r.k, pad)}</span>` +
          `<span class="${r.c}">${"█".repeat(n)}</span>` +
          `<span class="f">${"·".repeat(Math.max(0, width - n))}</span>` +
          `<span class="${r.c}"> ${padl(one(r.v), 6)}</span>`);
  });
}

function table(head, rows, classes) {
  const widths = head.map((h, i) =>
    Math.max(h.length, ...rows.map(r => String(r[i]).length)));
  // Widths are measured on raw text and escaped after padding, so an
  // ampersand in a stop name breaks neither the column nor the markup.
  const fmt = (cells, cls) => cells.map((c, i) =>
    `<span class="${cls ? cls[i] || "" : ""}">` +
    esc(i === 0 ? padr(c, widths[i]) : padl(c, widths[i])) + `</span>`).join("  ");
  print(`<span class="hd">${fmt(head)}</span>`);
  print(`<span class="rule">${widths.map(w => "─".repeat(w)).join("──")}</span>`);
  rows.forEach(r => print(fmt(r.map(String), classes)));
}

/* -------------------------------------------------------------- vehicle math */

// The exported numbers per vehicle: `now` is how late it runs right now,
// `entur`/`model` are the two predicted delays at its next stop, and `eta`
// is seconds until Ruter's expected arrival, all measured at export time.
// Arrivals shown to people drift with the age of the file; past a few
// minutes a countdown would list departures that already left, so the page
// switches to snapshot wording instead of quietly lying.
const STALE_AFTER = 300;
const fileAge = () => Date.now() / 1000 - DATA.t0;
const isFresh = () => fileAge() < STALE_AFTER;

function arrivals(v) {
  const drift = isFresh() ? fileAge() : 0;
  const ruter = v.eta - drift;
  return {ruter, ours: ruter + (v.model - v.entur)};
}

// This departure's own interval, in arrival times rather than in delays.
// Every vehicle gets its own: the spread is predicted from the same features
// as the middle, so a metro two stops from the end and a regional train an
// hour out do not get the same window. The published table gives an average
// per horizon, which is a summary of these, not a value any one of them has.
function windowOf(v) {
  if (v.low == null || v.high == null) return null;
  const scheduled = arrivals(v).ruter - v.entur;  // arrival with no delay
  const from = scheduled + v.low, to = scheduled + v.high;
  const when = s => (s <= 0 ? "nå" : "om " + dur(s));
  const width = v.high - v.low;
  // A window can genuinely collapse. Near arrival the delay is already known,
  // and the boats collapse at any distance: a ferry has no traffic to sit in,
  // so the model has learned the Nesodden crossing is all but deterministic
  // and gives it a nought-second spread fifteen minutes out. Printed as
  // "nå til nå, vindu 0 s" that correct answer reads as a broken one, so a
  // window this tight gets said in words instead of as an empty range.
  const text = width < 20 ? `${when(from)}, på sekundet` : `${when(from)} til ${when(to)}`;
  return {from: when(from), to: when(to), fromSec: from, toSec: to, text, width};
}

const MODE_NB = {metro:"T-bane", tram:"trikk", rail:"tog", water:"båt", bus:"buss"};

/* ------------------------------------------------------------------ commands */

const COMMANDS = {}, HIDDEN = {};
function def(name, summary, run, opts) {
  (opts && opts.hidden ? HIDDEN : COMMANDS)[name] = {summary, run, args:opts && opts.args};
}
const lookup = name => COMMANDS[name] || HIDDEN[name];

/* --- se --- */

def("resultat", "hvor mye hver av dem bommer", () => {
  const w = DATA.score.weighted, b = DATA.score.buckets;
  heading("gjennomsnittlig bom, sekunder");
  meterRows([
    {k:"rutetabell", v:w.timetable, c:"f"},
    {k:"naiv",       v:w.naive,     c:"d"},
    {k:"ruter",      v:w.entur,     c:"r"},
    {k:"punktlig",   v:w.model,     c:"g"},
  ], w.timetable, 44);
  blank();
  wrap(`«Bom» er avstanden mellom anslått og faktisk ankomst. Ruter-appens anslag
bommer i snitt <span class="r">${one(w.entur)} sekunder</span>. Punktlig bommer <span class="g">${one(w.model)}</span>, på nøyaktig
de samme sanntidsmeldingene. Det er <span class="w">${(100 - w.model / w.entur * 100).toFixed(1).replace(".", ",")} prosent mindre</span>, målt på
${NB(DATA.score.rows)} avganger modellen aldri har sett under trening.`);
  blank();
  heading("per hvor langt fram man gjetter");
  table(
    ["horisont", "rutetabell", "naiv", "ruter", "punktlig", "diff"],
    b.map(r => [r.horizon.replace("min", " min"), one(r.timetable), one(r.naive),
                one(r.entur), one(r.model), "-" + Math.round(r.entur - r.model) + " s"])
      .concat([["vektet", one(w.timetable), one(w.naive), one(w.entur), one(w.model),
                "-" + Math.round(w.entur - w.model) + " s"]]),
    ["", "f", "d", "r", "g", "g"]
  );
  blank();
  wrap(`<span class="d">Avstanden vokser med horisonten. Rett før avgang vet begge omtrent det
samme; tjue minutter unna er det bare mønstre å gå på, og da vinner den
som har lest arkivet. Skriv <span class="g">naiv</span> for det rareste funnet.</span>`);
  block();
});

def("naiv", "funnet som gjør vondt", () => {
  const w = DATA.score.weighted;
  heading("advarsel");
  wrap(`<span class="a">!</span> Den enkleste tenkelige gjetningen er å anta at forsinkelsen står
  stille: er vogna fire minutter sen nå, er den fire minutter sen når
  den når deg. Ingen modell, ingen data, én linje kode.`);
  blank();
  meterRows([
    {k:"naiv",  v:w.naive, c:"a"},
    {k:"ruter", v:w.entur, c:"r"},
  ], w.timetable, 44);
  blank();
  wrap(`  Den gjetningen bommer <span class="w">${(w.entur - w.naive).toFixed(1).replace(".", ",")} sekunder mindre</span> enn anslaget i appen,
  over hele materialet.`);
  blank();
  wrap(`<span class="d">  Det er ikke et angrep på noen. Sanntidssystemene skal dekke alt fra
  ferge til T-bane og kan ikke pusses på hver enkelt strekning. Men det
  er verdt å vite at det påkostede ikke automatisk slår det enkle.</span>`);
  block();
});

def("arkiv", "hva maskinen har samlet inn", () => {
  const a = DATA.archive;
  heading("arkivet");
  [["anrop arkivert", NB(a.calls)],
   ["spørringer", NB(a.polls)],
   ["linjer fulgt", String(a.lines)],
   ["holdeplasser", NB(a.stops)],
   ["dekker fra", new Date(a.since).toLocaleString("nb-NO", {dateStyle:"short", timeStyle:"short"})],
   ["dekker til", new Date(a.until).toLocaleString("nb-NO", {dateStyle:"short", timeStyle:"short"})],
   ["treningsrader", NB(DATA.score.trained_on)],
   ["fasitrader", NB(DATA.score.rows)],
  ].forEach(([k, v]) =>
    print(`<span class="d">${padr(k, 16)}</span><span class="f">${".".repeat(20)}</span> ` +
          `<span class="w">${v}</span>`));
  blank();
  const modes = {};
  for (const v of DATA.vehicles) modes[v.mode] = (modes[v.mode] || 0) + 1;
  heading("ute å kjøre akkurat nå");
  table(["type", "kjøretøy"],
    Object.entries(modes).sort((x, y) => y[1] - x[1])
      .map(([m, n]) => [MODE_NB[m] || m, String(n)]), ["w", "g"]);
  blank();
  wrap(`<span class="d">Innsamleren spør hvert minutt, døgnet rundt, og lagrer hele svaret,
ikke bare det siste. Det gir noe sanntids-API-et ikke gir: en logg over
hva som var trodd på hvert tidspunkt, ikke bare hva som til slutt
skjedde. Uten den loggen kan dette ikke måles i det hele tatt.</span>`);
  block();
});

def("modell", "hva som gjetter, kort fortalt", () => {
  heading("modellen, kort");
  wrap(`Punktlig er en modell som har lest arkivet og lært hvordan det pleier
å gå: hvor lang tid strekningene faktisk tar, hvor det alltid er sent i
rushen, hvordan en forsinkelse utvikler seg fra stopp til stopp.`);
  blank();
  wrap(`Når den gjetter på en avgang får den bare vite det appen din også vet
i samme sekund. Ingen hemmelige data, ingen fasit. Bare bedre bruk av
det som allerede er der.`);
  blank();
  wrap(`<span class="d">Det var den korte versjonen. Skriv <span class="g">metode</span> for den ordentlige:
features, no-lookahead-regelen, splitten og de målte ablasjonene.</span>`);
  block();
});

def("metode", "hele metoden, for de som har peiling", () => {
  heading("metode");
  wrap(`<span class="w">Modellklasse.</span> LightGBM, gradient-boostede beslutningstrær med L1-mål.
Trær framfor nevrale nett fordi dataene er tabulære med blandede typer
og hull: trær håndterer manglende verdier naturlig, trenger ingen
normalisering, og L1 optimerer MAE direkte, robust mot halehendelser.`);
  blank();
  wrap(`<span class="w">Prediksjonsoppgaven.</span> Gitt et øyeblikksbilde av en tur ved poll-tid T:
anslå forsinkelsen ved hvert framtidig stopp. En rad per (øyeblikk,
framtidig stopp), med horisonten som feature, slik at samme modell
dekker alt fra 0 til 45 minutter fram.`);
  blank();
  print(`<span class="w">Features.</span>`);
  [
    ["tilstand", "forsinkelse nå, trend siste stopp, alder på observasjonen"],
    ["rute", "planlagt kjøretid mot faktisk typisk kjøretid (slakk)"],
    ["nettverk", "forsinkelsesnivå på holdeplassen og linja siste 30 min"],
    ["kalender", "ukedag, time på døgnet"],
    ["vær", "MET-varselet som var utstedt ved T, aldri et nyere"],
    ["identitet", "linje, retning, holdeplass som kategoriske"],
  ].forEach(([k, v]) =>
    print(`  <span class="d">${padr(k, 10)}</span><span>${esc(v)}</span>`));
  if (DATA.score.importance) {
    blank();
    print(`<span class="w">Vekt i den trente modellen</span> <span class="d">(andel av total gain)</span>`);
    Object.entries(DATA.score.importance).slice(0, 8).forEach(([k, share]) => {
      const n = Math.round(share * 40);
      print(`  <span class="d">${padr(k, 22)}</span><span class="g">${"█".repeat(Math.max(1, n))}</span>` +
            `<span class="d"> ${(share * 100).toFixed(1).replace(".", ",")} %</span>`);
    });
  }
  blank();
  wrap(`<span class="w">No-lookahead, håndhevet strukturelt.</span> Hver treningsrad bygges kun av
data med tidsstempel før eller lik T: sanntidsbildet fra poll T,
værvarselet utstedt senest T, og historikk-aggregater fra tidsbøtter
som var LUKKET før T, siden en bøtte som fortsatt fylles kan inneholde
observasjoner fra etter T. Fasiten hentes fra en strengt senere poll.
Bryter man én av disse ser modellen strålende ut og er verdiløs.`);
  blank();
  wrap(`<span class="w">Splitt.</span> Journey-atomisk på driftsdøgn: siste døgn holdes helt utenfor
trening, og ingen tur bidrar med rader på begge sider. Radvis tilfeldig
splitt ville lekket, fordi rader fra samme tur sekunder fra hverandre
er nesten-duplikater.`);
  blank();
  wrap(`<span class="w">Målt, ikke antatt.</span> Hver featuregruppe er ablert på identiske data.
Buntingsfeatures (kjøretøyet foran) og avviksmeldinger målte som nuller
og er parkert til arkivet spenner flere uker.`);
  blank();
  wrap(`<span class="w">Modellen ser aldri appens eget anslag.</span> Å gi den det som inngang
er målt og gir 0,6 sekunder, altså nesten ingenting, og det er ikke verdt
prisen: en modell som låner svaret fra motparten kan ikke sammenlignes
med den. Tallene her er derfor tjent på egne features alene.`);
  blank();
  wrap(`<span class="d">Kildekoden er åpen: <a href="https://github.com/triceraz/Punktlig" target="_blank" rel="noopener">github.com/triceraz/Punktlig</a></span>`);
  block();
});

def("usikkerhet", "hvor mye kan den ta feil", () => {
  const u = DATA.score.uncertainty;
  if (!u) {
    print(`<span class="d">intervallmodellene er ikke trent på dette datasettet ennå.</span>`);
    return block();
  }
  heading("hvor mye kan den ta feil");
  wrap(`Et anslag uten usikkerhet er en påstand uten forbehold. Appen gir
ett tall og ingenting mer. Punktlig gir i tillegg et intervall: ikke
«bussen er tre minutter sen», men «${u.nominal} prosent sjanse for at den
lander innenfor dette vinduet».`);
  blank();
  wrap(`<span class="w">Det eneste tallet som betyr noe her er om løftet holder.</span> Et intervall
som sier ${u.nominal} prosent og treffer 55 er pynt, ikke usikkerhet.`);
  blank();
  table(["horisont", "n", "lovet", "traff", "vindu"],
    u.buckets.map(b => [
      b.horizon.replace("min", " min"), NB(b.n),
      u.nominal + " %",
      (100 * b.coverage).toFixed(1).replace(".", ",") + " %",
      dur(b.width_sec)])
      .concat([["samlet", NB(u.buckets.reduce((s, b) => s + b.n, 0)),
                u.nominal + " %",
                (100 * u.coverage).toFixed(1).replace(".", ",") + " %", ""]]),
    ["", "d", "d", "g", "a"]);
  blank();
  wrap(`<span class="d">Vinduet vokser med horisonten, slik det skal: ${dur(u.buckets[0].width_sec)}
rett før avgang, ${dur(u.buckets[u.buckets.length - 1].width_sec)} en halvtime fram.</span>`);
  blank();

  // The table above is an average, and an average window is not a window any
  // departure actually has. The spread between departures is larger than the
  // spread between horizon buckets, so saying only the average hides the
  // more interesting half of the result.
  const vinduer = DATA.vehicles.map(v => windowOf(v)).filter(Boolean)
                               .map(w => w.width).sort((a, b) => a - b);
  if (vinduer.length > 20) {
    const p = q => vinduer[Math.floor(q * (vinduer.length - 1))];
    wrap(`<span class="w">Men snittet er ikke vinduet noen enkelt avgang får.</span> Bredden regnes
per avgang, fra de samme opplysningene som selve anslaget, så en T-bane
to stopp fra endestasjonen og et regiontog en time unna får ikke samme
svar. Av de ${NB(vinduer.length)} vognene som er ute nå:`);
    blank();
    table(["", "vindu"], [
      ["smaleste fjerdedel", "under " + dur(p(0.25))],
      ["midt på", dur(p(0.5))],
      ["bredeste fjerdedel", "over " + dur(p(0.75))],
      ["bredeste enkeltvogn", dur(vinduer[vinduer.length - 1])],
    ], ["d", "a"]);
    blank();
    wrap(`<span class="d">Skriv <span class="g">holdeplass</span> eller klikk en vogn i kartet for å se
vinduet til akkurat den avgangen.</span>`);
  }
  block();
});

def("holdeplass", "avgangstavle med begge anslag", (arg) => {
  const stops = {};
  for (const v of DATA.vehicles)
    if (v.stop && v.entur != null && v.model != null) (stops[v.stop] ||= []).push(v);

  if (!arg) {
    heading("holdeplasser med flest avganger i bildet");
    const top = Object.entries(stops).sort((a, b) => b[1].length - a[1].length).slice(0, 12);
    table(["holdeplass", "avganger"], top.map(([s, v]) => [s, String(v.length)]), ["w", "d"]);
    blank();
    wrap(`<span class="d">Skriv <span class="g">holdeplass ${esc((top[0] ? top[0][0] : "Jernbanetorget").toLowerCase())}</span>. Tab fullfører navnet.</span>`);
    return block();
  }

  const q = arg.toLowerCase();
  const name = Object.keys(stops).find(s => s.toLowerCase() === q)
            || Object.keys(stops).find(s => s.toLowerCase().startsWith(q))
            || Object.keys(stops).find(s => s.toLowerCase().includes(q));
  if (!name) {
    print(`<span class="err">ingen holdeplass som ligner «${esc(arg)}» i bildet nå. ` +
          `<span class="g">holdeplass</span> gir en liste.</span>`);
    return block();
  }

  const rows = stops[name].map(v => ({v, arr:arrivals(v)}))
    .filter(x => x.arr.ruter > -60).sort((a, b) => a.arr.ours - b.arr.ours).slice(0, 8);
  heading(name + (isFresh() ? "" : "  (øyeblikksbilde fra " +
          new Date(DATA.t0 * 1000).toLocaleTimeString("nb-NO", {hour12:false}) + ")"));
  if (!rows.length) {
    print(`<span class="d">ingen avganger igjen i denne fila for ${esc(name)}.</span>`);
    return block();
  }
  const hasWindow = rows.some(({v}) => windowOf(v));
  wrap(`<span class="d">To ankomsttider for samme vogn: den appen viser, og vår.` +
       (hasWindow ? ` Kolonnen «80 %»\ner denne avgangens eget vindu, ikke et snitt: hver vogn får sitt.`
                  : "") + `</span>`);
  blank();
  // Five columns of "om 1 min 34 s" ran the table to 99 characters in a
  // console 82 wide, so the last column scrolled off the side. Inside the
  // table the "om" is redundant, since the heading already says these are
  // waits, and at a terminus the destination repeats the stop you asked about.
  const brief = s => (s <= 0 ? "nå" : dur(s));
  table(hasWindow ? ["linje", "appen", "punktlig", "80 % innen", "sen nå"]
                  : ["linje", "appen", "punktlig", "sen nå"],
    rows.map(({v, arr}) => {
      const w = windowOf(v);
      const dest = String(v.dest || "?");
      const cells = [
        `${v.line} mot ${dest.length > 15 ? dest.slice(0, 14) + "…" : dest}`,
        brief(arr.ruter),
        brief(arr.ours),
      ];
      if (hasWindow) {
        cells.push(!w ? "?" : w.width < 20 ? brief(w.fromSec)
                            : `${brief(w.fromSec)} – ${brief(w.toSec)}`);
      }
      cells.push(v.now == null ? "?" : signed(v.now));
      return cells;
    }),
    hasWindow ? ["w", "r", "g", "a", "d"] : ["w", "r", "g", "a"]);
  blank();
  const disagree = rows.filter(({v}) => Math.abs(v.model - v.entur) >= 30).length;
  wrap(`<span class="d">${disagree ? `Uenige om ${disagree} av ${rows.length} her, med minst et halvt minutt.`
                                    : `Her er de stort sett enige akkurat nå.`}
Prøv <span class="g">linje ${esc(String(rows[0].v.line).toLowerCase())}</span> for å følge vogna.</span>`);
  block();
});

// One table, read by both the command and the label, so the two cannot
// disagree. They did: the header claimed trains were drawn while the map
// showed only metro and tram.
const MAP_MODES = {
  alt:   {set:["metro","tram","rail","water","bus"], label:"alt"},
  bane:  {set:["metro","tram","rail"],               label:"bane + trikk + tog"},
  tbane: {set:["metro","tram"],                      label:"t-bane + trikk"},
  tog:   {set:["rail"],                              label:"tog"},
  buss:  {set:["bus"],                               label:"buss"},
  av:    {set:[],                                    label:"av"},
};
const DEFAULT_MAP = "alt";

// The modes whose colour is part of how people name the line: the five metro
// lines and the trikk. Vy publishes red for several of its train lines and
// Ruter red for half its buses, and red on this map means a badly delayed
// vehicle. Everything outside this set is drawn in a background shade so the
// one colour that carries meaning keeps carrying it.
const LINE_COLOUR = new Set(["metro", "tram"]);
const BACKGROUND_LINE = {rail: "#3f5a86", water: "#2f5560", bus: "#26313d"};

// Whether a mode contributes its route geometry. There are 305 bus routes and
// ten metro lines; drawn together, the buses are a grey web across the whole
// picture, and the thing the map exists to show, where the vehicles are and
// how late they are, sits underneath it. So bus lines are drawn when buses
// are what you asked for, and not when they are merely included. Bus vehicles
// are always drawn either way.
const lined = mode => DRAW.has(mode) && (mode !== "bus" || DRAW.size <= 2);

def("kart", "styr kartet: alt, bane, tog, buss, av", (arg) => {
  const modes = MAP_MODES;
  const pick = modes[(arg || "").toLowerCase()];
  if (!pick) {
    const list = Object.keys(modes).map(k => `<span class="g">${k}</span>`).join(", ");
    print(arg ? `<span class="err">kjenner ikke «${esc(arg)}».</span> <span class="d">prøv: ${list}</span>`
              : `<span class="d">kart ${list}</span>`);
    return block();
  }
  DRAW = new Set(pick.set);
  // The frame follows what is drawn, so it has to be remeasured, and a zoom
  // held over from the previous mode would point at the wrong place.
  view = null; zoom = 1;
  document.getElementById("mapmode").textContent = pick.label;
  print(`<span class="d">kart: ${pick.label}.` +
        (pick.set.length ? " klikk en vogn for detaljer her, dra for å flytte, rull for å zoome." : "") +
        `</span>`);
  block();
});

def("tema", "fosforfarge: grønn, rav, blå, hvit", (arg) => {
  const themes = {"grønn":"", "gronn":"", "rav":"rav", "blå":"blaa", "bla":"blaa", "hvit":"hvit"};
  const key = (arg || "").toLowerCase();
  if (!(key in themes)) {
    // Say which word was not understood, the way `kart` does. Answering an
    // unknown colour with the same line as no argument at all leaves the
    // reader unsure whether it was rejected or simply ignored.
    const list = `<span class="d">tema grønn | rav | blå | hvit</span>`;
    print(arg ? `<span class="err">kjenner ikke «${esc(arg)}».</span> ${list}` : list);
    return block();
  }
  themes[key] ? document.documentElement.setAttribute("data-theme", themes[key])
              : document.documentElement.removeAttribute("data-theme");
  print(`<span class="d">tema: ${esc(key)}</span>`);
  block();
});

const ALIAS = {help:"hjelp", clear:"tøm", tom:"tøm", score:"resultat", stop:"holdeplass",
               stopp:"holdeplass", about:"om", map:"kart", limits:"grenser",
               why:"modell", hvorfor:"modell", man:"hjelp", entur:"kilder", ruter:"kilder"};

/* ------------------------------------------------------------------ the line */

let history = [], hpos = -1;

function run(raw) {
  const text = raw.trim();
  print(`punktlig@arkiv:~$ <b>${esc(text)}</b>`, "echo");
  if (!text) return;
  const [head, ...rest] = text.split(/\s+/);
  const key = ALIAS[head.toLowerCase()] || head.toLowerCase();
  const c = lookup(key);
  if (!c) {
    print(`<span class="err">ukjent kommando: ${esc(head)}.</span> <span class="d">skriv <span class="g">hjelp</span>.</span>`);
    return block();
  }
  c.run(rest.join(" "));
}

// How far every candidate agrees. A shell fills this in before listing, so
// "dram" becomes "Drammen" in one keystroke even though two stops match.
function commonPrefix(words) {
  if (!words.length) return "";
  let prefix = words[0];
  for (const word of words.slice(1)) {
    let i = 0;
    while (i < prefix.length && i < word.length &&
           prefix[i].toLowerCase() === word[i].toLowerCase()) i++;
    prefix = prefix.slice(0, i);
  }
  return prefix;
}

function complete() {
  const parts = cmd.value.split(/\s+/);
  if (parts.length <= 1) {
    const hits = Object.keys(COMMANDS).filter(k => k.startsWith(parts[0].toLowerCase()));
    if (hits.length === 1) cmd.value = hits[0] + (COMMANDS[hits[0]].args ? " " : "");
    else if (hits.length > 1) {
      const shared = commonPrefix(hits);
      if (shared.length > parts[0].length) cmd.value = shared;
      print(`<span class="d">${hits.join("   ")}</span>`);
      block();
    }
    return;
  }
  const key = ALIAS[parts[0].toLowerCase()] || parts[0].toLowerCase();
  if (key !== "holdeplass") return;
  const typed = parts.slice(1).join(" ");
  const q = typed.toLowerCase();
  const names = [...new Set(DATA.vehicles.filter(v => v.stop).map(v => v.stop))];
  const hits = names.filter(n => n.toLowerCase().startsWith(q));

  if (!hits.length) {
    // Silence reads as a broken key rather than as "no such stop".
    print(`<span class="d">ingen holdeplass starter med «${esc(typed)}»</span>`);
    return block();
  }
  // An exact hit wins even when longer names extend it: typing the whole name
  // and pressing tab should accept it, not merely list it again.
  const exact = hits.find(n => n.toLowerCase() === q);
  if (hits.length === 1 || exact) {
    cmd.value = "holdeplass " + (exact || hits[0]);
    return;
  }
  const shared = commonPrefix(hits);
  if (shared.length > typed.length) cmd.value = "holdeplass " + shared;
  print(`<span class="d">${hits.slice(0, 12).map(esc).join("   ")}` +
        (hits.length > 12 ? `<span class="f">   +${hits.length - 12} til</span>` : "") +
        `</span>`);
  block();
}

cmd.addEventListener("keydown", ev => {
  if (printing && ev.key.length === 1) flush();
  if (ev.key === "Enter") {
    const v = cmd.value; cmd.value = "";
    if (v.trim()) { history.unshift(v.trim()); hpos = -1; }
    run(v);
  } else if (ev.key === "Tab") {
    ev.preventDefault(); complete();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    if (hpos + 1 < history.length) cmd.value = history[++hpos];
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cmd.value = hpos > 0 ? history[--hpos] : (hpos = -1, "");
  } else if (ev.key === "c" && ev.ctrlKey) {
    if (!getSelection().toString()) { flush(); cmd.value = ""; }
  }
});
addEventListener("mouseup", () => {
  if (!getSelection().toString() && !matchMedia("(pointer: coarse)").matches) cmd.focus();
});
addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (document.activeElement !== cmd && ev.key.length === 1) cmd.focus();
});

document.getElementById("chips").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  cmd.value = ""; run(b.dataset.run);
});

/* ------------------------------------------------------------------ the map */

// Frame on whatever is drawn. Framing on metro and tram while also drawing
// rail put the frame around Oslo and the content around Østlandet: the train
// lines ran off every edge towards Gardermoen and Halden, and five of six
// vehicles sat outside the picture. Trains are still one keystroke away
// (`kart tog`, `kart alt`), and asking for them now moves the frame with them.
let DRAW = new Set(MAP_MODES[DEFAULT_MAP].set);
// Thick enough to read as a network at a glance. At two pixels the lines
// looked like pencil marks on a large black field.
const WEIGHT = {metro:4.6, tram:3.2, rail:2.8, water:2.2, bus:.9};
// The hubs a local recognises the shape by; drawn as faint labels. Downtown
// keeps one name, since every central stop overlaps every other there.
const HUBS = ["Jernbanetorget", "Majorstuen", "Tøyen",
              "Lillestrøm", "Sandvika", "Ski stasjon"];
const merc = (lon, lat) => [lon * Math.PI / 180,
                            Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let view = null, drawnVehicles = [];

// Where to point the camera. Both obvious answers are wrong, and the page has
// now shipped each of them. Framing on everything drawn puts Eidsvoll, Halden
// and Moss in the picture, and central Oslo, where nearly every vehicle is,
// becomes a smudge a centimetre across. Framing on a fixed core instead, metro
// and tram, while `kart alt` draws buses and trains across a region four times
// larger, did the reverse: the city rendered as a thin band across the middle
// of an otherwise empty panel, 171 of 742 vehicles fell outside it entirely,
// and every train line ran off an edge. The frame and the picture were two
// different maps.
//
// So the frame is measured on the vehicles themselves, clipped at the second
// and ninety-eighth percentile of each axis. The picture lands where the
// traffic is, and one train an hour out of town cannot set the scale for the
// other seven hundred. Whatever falls outside is one scroll away.
// Measured on a weekday midday: a 2 percent clip still spans 42 km and leaves
// the city a clump, an 18 percent clip is 15 km and throws away half the
// traffic. 5 percent is 33 km, which reaches Lillestrøm, Sandvika and Ski and
// keeps 84 percent of what is running. The rest is one scroll away.
const FRAME_CLIP = 0.05;
const MAX_ZOOM = 40;

// Sorted so the clip can be read off by index; the arrays are built per fit
// and belong to nobody else, so sorting in place is free.
function clipped(values, clip) {
  values.sort((a, b) => a - b);
  const i = Math.min(values.length - 1, Math.floor(values.length * clip));
  return [values[i], values[values.length - 1 - i]];
}

let base = null, zoom = 1, panX = 0, panY = 0;
// Canvas text is sized in pixels, and the page's own type is now a clamp on
// the viewport. Reading the resolved size once per fit keeps the labels in
// proportion with everything around them instead of drifting out of it on a
// small screen.
let TYPE_PX = 19;

function fit() {
  const box = cv.getBoundingClientRect();
  if (!box.width || !box.height) return false;
  TYPE_PX = parseFloat(getComputedStyle(document.body).fontSize) || 19;
  const dpr = devicePixelRatio || 1;
  cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  view = {w: box.width, h: box.height};

  const xs = [], ys = [];
  for (const v of DATA.vehicles) {
    if (!DRAW.has(v.mode)) continue;
    const [x, y] = merc(v.lon, v.lat);
    xs.push(x); ys.push(y);
  }
  // At night, or for a mode with nothing running, there are too few vehicles
  // to describe a region. Then the network itself is the best available
  // answer, which is also what `kart av` gets.
  if (xs.length < 25) {
    const S = DATA.network.stops;
    for (const r of DATA.network.routes) {
      if (!DRAW.has(r.mode)) continue;
      for (const i of r.path) {
        const [x, y] = merc(S[i][0], S[i][1]);
        xs.push(x); ys.push(y);
      }
    }
  }
  if (!xs.length) {
    base = {k: 1, x0: 0, y1: 0, ox: 0, oy: 0, cw: 0, ch: 0};
    zoom = 1; panX = panY = 0;
    return true;
  }
  const [x0, x1] = clipped(xs, FRAME_CLIP);
  const [y0, y1] = clipped(ys, FRAME_CLIP);
  const pad = 26;
  const k = Math.min((box.width - pad * 2) / Math.max(x1 - x0, 1e-9),
                     (box.height - pad * 2) / Math.max(y1 - y0, 1e-9));
  const cw = (x1 - x0) * k, ch = (y1 - y0) * k;
  base = {k, x0, y1, cw, ch,
          ox: (box.width - cw) / 2, oy: (box.height - ch) / 2};
  clampPan();
  return true;
}

// Panning is bounded so the map cannot be flung into the void. Zoomed in, the
// content must keep covering the panel; zoomed out far enough that it does
// not, it simply centres and the drag does nothing.
function clampPan() {
  if (!base || !view) return;
  const cw = base.cw * zoom, ch = base.ch * zoom;
  const lx = base.ox * zoom, ly = base.oy * zoom;
  panX = cw >= view.w ? Math.min(-lx, Math.max(view.w - lx - cw, panX))
                      : (view.w - cw) / 2 - lx;
  panY = ch >= view.h ? Math.min(-ly, Math.max(view.h - ly - ch, panY))
                      : (view.h - ch) / 2 - ly;
}

// Zoom about a point, so the stop under the cursor stays under the cursor.
function zoomAt(mx, my, factor) {
  const next = Math.min(MAX_ZOOM, Math.max(1, zoom * factor));
  if (next === zoom) return;
  const f = next / zoom;
  panX = mx - (mx - panX) * f;
  panY = my - (my - panY) * f;
  zoom = next;
  clampPan();
}

const px = (lon, lat) => {
  const [x, y] = merc(lon, lat);
  return [(base.ox + (x - base.x0) * base.k) * zoom + panX,
          (base.oy + (base.y1 - y) * base.k) * zoom + panY];
};

// Worst last, so it lands on top. Downtown the dots overlap several deep, and
// painted in export order a badly delayed vehicle disappears under whichever
// punctual one happens to follow it in the file. Red is the thing you scan the
// map for; it has to be the thing you can see. Sorted once per export rather
// than once per frame, since the delays only change when the file does, and
// kept apart from DATA.vehicles so the log below keeps its own order.
let vOrder = null, vOrderAt = null;
function paintOrder() {
  if (vOrderAt !== DATA.t0) {
    vOrderAt = DATA.t0;
    vOrder = DATA.vehicles.slice().sort(
      (a, b) => (a.now == null ? -1 : a.now) - (b.now == null ? -1 : b.now));
  }
  return vOrder;
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function draw() {
  requestAnimationFrame(draw);
  if (!DATA) return;
  if (!view && !fit()) return;
  ctx.clearRect(0, 0, view.w, view.h);
  const S = DATA.network.stops;
  // Theme colours once per frame, not per vehicle.
  const skin = {route:css("--fg-dim"), faint:css("--fg-faint"), dim:css("--dim"),
                ink:css("--ink"), ok:css("--fg"), warn:css("--amber"), bad:css("--red")};

  // Lines carry their own colour. Drawn in one phosphor shade the network
  // read as a scribble: five metro lines through the same tunnel became one
  // stroke, and nothing told you which line you were looking at. The colours
  // are the ones an Osloite recognises before reading a word, and they come
  // from the export rather than from a list written here.
  //
  // Each route is laid down twice: a dark casing first, then the colour on
  // top. That is what keeps parallel lines legible where they run together,
  // and it is why a transit map looks like a map and not like wiring.
  for (const pass of ["casing", "colour"]) {
    for (const mode of ["bus", "water", "rail", "tram", "metro"]) {
      if (!lined(mode)) continue;
      const width = WEIGHT[mode];
      ctx.lineJoin = ctx.lineCap = "round";
      for (const r of DATA.network.routes) {
        if (r.mode !== mode || r.path.length < 2) continue;
        if (pass === "casing") {
          ctx.strokeStyle = "#04060a";
          ctx.lineWidth = width + 3;
          ctx.globalAlpha = 1;
        } else {
          // Only the lines a passenger identifies by colour get to keep one.
          // Ruter publishes a colour for buses too, and it is red: drawn with
          // it, three hundred bus routes turn the city into a red web and the
          // one thing red is supposed to mean here, a badly delayed vehicle,
          // becomes invisible. Red belongs to lateness on this map.
          ctx.strokeStyle = LINE_COLOUR.has(mode) ? (r.colour || skin.route)
                                                  : (BACKGROUND_LINE[mode] || "#26313d");
          ctx.lineWidth = width;
          ctx.globalAlpha = mode === "bus" ? .8 : .95;
        }
        ctx.beginPath();
        r.path.forEach((idx, i) => {
          const [x, y] = px(S[idx][0], S[idx][1]);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;

  // A stop on every line it serves, so the shape reads as stations rather
  // than as a bare polyline. Bus is left out: three hundred routes of dots
  // is noise, not information.
  const drawnStops = new Set();
  for (const r of DATA.network.routes) {
    if (!lined(r.mode) || r.mode === "bus") continue;
    for (const idx of r.path) drawnStops.add(idx);
  }
  ctx.fillStyle = "#0b1016";
  ctx.strokeStyle = "#8fa6b8";
  ctx.lineWidth = 1.4;
  for (const idx of drawnStops) {
    const [x, y] = px(S[idx][0], S[idx][1]);
    if (x < 0 || y < 0 || x > view.w || y > view.h) continue;
    ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill(); ctx.stroke();
  }

  const now = Date.now() / 1000;
  drawnVehicles = [];
  for (const v of paintOrder()) {
    if (!DRAW.has(v.mode)) continue;
    const t = v.eta > 0 ? Math.min(1, Math.max(0, (now - DATA.t0) / v.eta)) : 0;
    const [x, y] = px(v.lon + (v.tlon - v.lon) * t, v.lat + (v.tlat - v.lat) * t);
    if (x < -10 || y < -10 || x > view.w + 10 || y > view.h + 10) continue;
    drawnVehicles.push({x, y, v});
    const radius = v.mode === "bus" ? 3.4 : 4.6;
    // A dark ring around each vehicle. Without it a green dot on a green
    // line simply disappears, which is the one thing on this map that has
    // to stay visible.
    ctx.beginPath(); ctx.arc(x, y, radius + 1.6, 0, 7);
    ctx.fillStyle = "#04060a"; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, radius, 0, 7);
    ctx.fillStyle = v.now == null ? skin.dim
                  : v.now < 60 ? skin.ok : v.now < 180 ? skin.warn : skin.bad;
    ctx.fill();
  }

  // Names last, so they sit above the vehicles. Drawn before them, every
  // useful anchor downtown ended up under the dot cloud, which is exactly
  // where a reader needs one: without a name the map is coloured confetti on
  // black. Each gets a dark outline first, so it stays readable wherever it
  // lands rather than only over empty background.
  //
  // At the fitted frame only the handful of hubs a local recognises the shape
  // by, because every central stop overlaps every other one there. Zoomed in
  // there is real room, so more names appear as they stop colliding. A map
  // that answers "which stop is that" once you look closely is the point of
  // being able to look closely.
  const fs = Math.max(11, Math.round(TYPE_PX * 0.66));
  ctx.font = fs + "px " + css("--mono");
  ctx.lineJoin = "round";
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#04060a";
  const labelled = new Set(), boxes = [];
  const place = (name, x, y, hub) => {
    if (!name || labelled.has(name) || boxes.length >= 80) return;
    const w = ctx.measureText(name).width;
    const b = [x + 6, y - 5 - fs, x + 6 + w, y - 5];
    for (const o of boxes)
      if (b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]) return;
    boxes.push(b); labelled.add(name);
    ctx.strokeText(name, x + 6, y - 5);
    ctx.fillStyle = hub ? skin.ink || "#c9dcd0" : skin.dim;
    ctx.fillText(name, x + 6, y - 5);
  };
  // Hubs first, so that when two names compete for the same patch of canvas
  // the one people navigate by is the one that survives.
  for (const s of S) {
    if (!HUBS.includes(s[2])) continue;
    const [x, y] = px(s[0], s[1]);
    if (x < 0 || y < 0 || x > view.w || y > view.h) continue;
    place(s[2], x, y, true);
  }
  if (zoom >= 2) {
    for (const idx of drawnStops) {
      const s = S[idx];
      const [x, y] = px(s[0], s[1]);
      if (x < 0 || y < 0 || x > view.w || y > view.h) continue;
      place(s[2], x, y, false);
    }
  }

  // Count the delay from what is actually on screen, not from the whole
  // region: a train an hour late outside Akershus is not what the picture in
  // front of you is showing.
  const shown = drawnVehicles.map(d => d.v).filter(v => v.now != null);
  const worst = shown.reduce((m, v) => Math.max(m, v.now), 0);
  const late = shown.filter(v => v.now >= 180).length;
  const total = DATA.vehicles.filter(v => DRAW.has(v.mode)).length;
  // Written only when it changes. This runs on every animation frame, and
  // assigning textContent sixty times a second forces layout sixty times a
  // second for a string that turns over once or twice.
  const info = !DRAW.size ? "kartet er av"
    : `${drawnVehicles.length} av ${total} vogner` +
      (shown.length ? ` · ${late} over 3 min · verste ${dur(worst)}` : "");
  if (info !== lastInfo) {
    document.getElementById("mapinfo").textContent = lastInfo = info;
  }
  const z = zoom > 1.02 ? `${zoom.toFixed(1)}×` : "";
  if (z !== lastZoom) document.getElementById("mapzoom").textContent = lastZoom = z;
}
let lastInfo = null, lastZoom = null;
addEventListener("resize", () => { view = null; });

/* --- driving the map --- */

// A static overview of Oslo and Akershus in one panel can only ever be a
// thumbnail: the region is a hundred kilometres across and the interesting
// part is two. Being able to move and scale the picture is what makes the map
// an instrument rather than a decoration.
const at = ev => { const b = cv.getBoundingClientRect();
                   return [ev.clientX - b.left, ev.clientY - b.top]; };

cv.addEventListener("wheel", ev => {
  if (!base) return;
  ev.preventDefault();
  const [mx, my] = at(ev);
  // Exponential in the wheel delta, so a trackpad flick and a mouse notch
  // both feel proportional rather than one of them being unusable.
  zoomAt(mx, my, Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0018)));
}, {passive: false});

let dragFrom = null, dragged = 0;
cv.addEventListener("pointerdown", ev => {
  if (!base) return;
  dragFrom = at(ev); dragged = 0;
  cv.setPointerCapture(ev.pointerId);
  cv.classList.add("drag");
});
cv.addEventListener("pointermove", ev => {
  if (!dragFrom) return;
  const [mx, my] = at(ev);
  panX += mx - dragFrom[0]; panY += my - dragFrom[1];
  dragged += Math.abs(mx - dragFrom[0]) + Math.abs(my - dragFrom[1]);
  dragFrom = [mx, my];
  clampPan();
});
const endDrag = () => { dragFrom = null; cv.classList.remove("drag"); };
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

// Double click returns to the fitted frame, which is the only way back out
// once you have scrolled into a single junction.
cv.addEventListener("dblclick", ev => {
  ev.preventDefault();
  zoom = 1; clampPan();
});

// Click a dot: the vehicle reports to the console, in console form. A click
// that ended a drag is not a click on anything; without this guard, pushing
// the map aside opened whichever vehicle happened to be under the finger.
cv.addEventListener("click", ev => {
  if (dragged > 4) return;
  const [mx, my] = at(ev);
  let best = null, bestD = 12 * 12;
  for (const d of drawnVehicles) {
    const dd = (d.x - mx) ** 2 + (d.y - my) ** 2;
    if (dd < bestD) { bestD = dd; best = d.v; }
  }
  if (!best) return;
  flush();
  const arr = arrivals(best);
  print(`kart-klikk${isFresh() ? "" : "  (øyeblikksbilde fra " +
        new Date(DATA.t0 * 1000).toLocaleTimeString("nb-NO", {hour12:false}) + ")"}`, "echo");
  print(`<span class="w">linje ${esc(best.line)} mot ${esc(best.dest || "?")}</span> ` +
        `<span class="d">(${MODE_NB[best.mode] || best.mode}), neste stopp ${esc(best.stop || "?")}</span>`);
  print(`  <span class="d">${padr("sen akkurat nå", 16)}</span><span class="a">${best.now == null ? "?" : signed(best.now)}</span>`);
  print(`  <span class="d">${padr("appen sier", 16)}</span><span class="r">${arr.ruter <= 0 ? "nå" : "om " + dur(arr.ruter)}</span>` +
        `<span class="d">  (tror ${signed(best.entur)} ved stoppet)</span>`);
  print(`  <span class="d">${padr("punktlig sier", 16)}</span><span class="g">${arr.ours <= 0 ? "nå" : "om " + dur(arr.ours)}</span>` +
        `<span class="d">  (tror ${signed(best.model)})</span>`);
  const w = windowOf(best);
  if (w) {
    print(`  <span class="d">${padr("80 % innen", 16)}</span>` +
          `<span class="a">${w.text}</span>` +
          `<span class="d">  vindu ${dur(w.width)}</span>`);
  }
  block();
});

/* ------------------------------------------------------------------ the tail */

// One line per departure the model has just priced: what the app says, what
// we say, and the gap, in seconds, so the disagreement is legible.
let tailOn = true, feedAt = 0;
function emit() {
  if (!tailOn || !DATA) return;
  const pool = DATA.vehicles.filter(v => v.stop && v.entur != null && v.model != null);
  if (!pool.length) return;
  const v = pool[feedAt++ % pool.length];
  const gap = v.model - v.entur;
  const cls = v.now == null ? "d" : v.now > 180 ? "r" : v.now > 60 ? "a" : "g";
  // Compact durations, so the disagreement at the end survives the pane width.
  const sd = s => { s = Math.round(s); const m = Math.trunc(Math.abs(s) / 60);
                    return (s < 0 ? "-" : "+") + (m ? m + "m" : "") + Math.abs(s % 60) + "s"; };
  const el = document.createElement("div");
  el.innerHTML =
    `<span class="d">${new Date().toLocaleTimeString("nb-NO", {hour:"2-digit", minute:"2-digit"})}</span> ` +
    `<span class="${cls}">${esc(padr(v.line, 5))}</span>` +
    `<span>${esc(padr("mot " + String(v.dest || v.stop).slice(0, 18), 23))}</span>` +
    `<span class="d">app </span><span class="r">${esc(padl(sd(v.entur), 7))}</span>` +
    `<span class="d">  vi </span><span class="g">${esc(padl(sd(v.model), 7))}</span>` +
    (Math.abs(gap) >= 30
      ? `<span class="a">  uenige ${dur(Math.abs(gap))}</span>`
      : `<span class="f">  enige</span>`);
  const feed = document.getElementById("feed");
  feed.appendChild(el);
  // Keep only as many lines as fit whole. The count was fixed at seven while
  // the pane's height is a fraction of the window, so on most screens the
  // bottom line was sliced through the middle: half a row of text sitting
  // under the last readable one, on every screen size, permanently.
  const lh = el.offsetHeight || 1;
  const style = getComputedStyle(feed);
  const room = feed.clientHeight - parseFloat(style.paddingTop)
                                 - parseFloat(style.paddingBottom);
  const fits = Math.max(1, Math.floor(room / lh));
  while (feed.childElementCount > fits) feed.removeChild(feed.firstChild);
}

setInterval(() => document.getElementById("clock").textContent =
  new Date().toLocaleTimeString("nb-NO", {hour12:false}), 1000);

/* ------------------------------------------------------------------ boot */

function boot() {
  const w = DATA.score.weighted, a = DATA.archive;
  SPEED = 24;
  [
    ` ____   _   _  _   _  _  __ _____  _      ___   ____`,
    `|  _ \\ | | | || \\ | || |/ /|_   _|| |    |_ _| / ___|`,
    `| |_) || | | ||  \\| || ' /   | |  | |     | | | |  _`,
    `|  __/ | |_| || |\\  || . \\   | |  | |___  | | | |_| |`,
    `|_|     \\___/ |_| \\_||_|\\_\\  |_|  |_____||___| \\____|`,
  ].forEach(l => print(`<span class="g">${l}</span>`));
  blank();
  print(`<span class="d">sanntidsarkiv for kollektivtrafikk · Oslo og Akershus</span>`);
  blank();
  SPEED = 13;
  print(`<span class="f">[</span><span class="g">ok</span><span class="f">]</span> ` +
        `<span class="d">arkiv ......... ${NB(a.calls)} målinger, ${a.lines} linjer, ${NB(a.stops)} holdeplasser</span>`);
  print(`<span class="f">[</span><span class="g">ok</span><span class="f">]</span> ` +
        `<span class="d">modell ........ trent på ${NB(DATA.score.trained_on)} rader</span>`);
  print(`<span class="f">[</span><span class="g">ok</span><span class="f">]</span> ` +
        `<span class="d">sanntid ....... ${DATA.vehicles.length} vogner ute akkurat nå</span>`);
  blank();
  SPEED = 10;
  heading("kort fortalt");
  wrap(`Ruter-appen sier «2 min». Alle vet hva det betyr: kanskje 2, kanskje 6.
Denne maskinen har notert hvert eneste anslag appen har vist og målt det
mot hva som faktisk skjedde.`);
  blank();

  // The finding belongs on the first screen, not a paragraph describing it.
  // Without this the console sat forty percent empty while the one number
  // the page exists to report was three sentences into a block of prose.
  meterRows([
    {k: "rutetabell", v: w.timetable, c: "f"},
    {k: "naiv gjetning", v: w.naive, c: "a"},
    {k: "ruter-appen", v: w.entur, c: "r"},
    {k: "punktlig", v: w.model, c: "g"},
  ], w.timetable, 40);
  print(`<span class="d">${" ".repeat(15)}gjennomsnittlig bom i sekunder, ` +
        `${NB(DATA.score.rows)} avganger</span>`);
  blank();
  wrap(`<span class="g">${(100 * (1 - w.model / w.entur)).toFixed(0)} prosent lavere bom enn appen</span>, på nøyaktig samme
informasjon. Og den flaueste målingen: å anta at forsinkelsen aldri
endrer seg bommer <span class="a">${one(w.naive)}</span>. Mindre enn appen.`);
  blank();
  wrap(`<span class="d">Skriv <span class="g">hjelp</span>, trykk på en knapp under, eller klikk en vogn i kartet.</span>`);
  block();
}

/* ------------------------------------------------------------------ start */

// The export lives in object storage rather than in the repository. Keeping
// it in git meant a commit every ten minutes, which grew to three quarters
// of the project's history and buried every real change. The local copy is
// still tried afterwards so the page works when served from the machine that
// produced it, before anything has been published.
const SOURCES = [
  "https://zezsdyxlvwhunuvyztec.supabase.co/storage/v1/object/public/punktlig/data.json",
  "data.json",
];

async function loadData() {
  let last;
  for (const src of SOURCES) {
    try {
      const r = await fetch(src + "?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) throw new Error(`${r.status} fra ${src}`);
      return await r.json();
    } catch (err) {
      last = err;
    }
  }
  throw last;
}

loadData()
  .then(d => {
    DATA = d;
    DATA.t0 = new Date(d.generated_at).getTime() / 1000;
    if (d.score.importance) {
      DATA.score.importance = Object.fromEntries(
        Object.entries(d.score.importance).sort((a2, b2) => b2[1] - a2[1]));
    }

    // Every command worth a first visit gets a button. Eight of the sixteen
    // used to be reachable only by typing `hjelp` first, and the calibrated
    // interval, which is the one thing here the official feed cannot do at
    // all, was among the hidden ones. A terminal may be typed at; it should
    // not require it before showing what it holds.
    document.getElementById("chips").innerHTML =
      ["resultat", "usikkerhet", "holdeplass", "linje", "naiv", "modell",
       "metode", "arkiv", "kilder", "grenser", "om", "hjelp"]
      .map(r => `<button data-run="${r}">${r}</button>`).join("");

    const stamp = () => {
      const mins = Math.round(fileAge() / 60);
      document.getElementById("mapmode").textContent = MAP_MODES[DEFAULT_MAP].label;
    document.getElementById("feedstate").textContent =
        mins < 2 ? "sanntid" : `data fra ${new Date(DATA.t0 * 1000)
          .toLocaleTimeString("nb-NO", {hour12:false})} (${mins} min siden)`;
    };
    stamp(); setInterval(stamp, 30_000);

    boot();
    draw();
    for (let i = 0; i < 7; i++) emit();
    setInterval(emit, 1700);
    if (!matchMedia("(pointer: coarse)").matches) cmd.focus();

    const deep = decodeURIComponent(location.hash.slice(1));
    const head = deep.split(" ")[0].toLowerCase();
    if (head && (lookup(head) || ALIAS[head])) setTimeout(() => run(deep), 900);
  })
  .catch(() => {
    print(`<span class="err">kunne ikke laste data.json. arkivet svarer ikke akkurat nå.</span>`);
  });
</script>
